<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interview</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 30px;
      }

      #questionSection {
        display: none;
        margin-top: 30px;
      }

      #recordingSection {
        display: none;
        margin-top: 20px;
      }

      video {
        width: 100%;
        max-width: 700px;
        background: #000;
        border-radius: 8px;
      }

      button {
        padding: 10px 18px;
        margin: 10px 5px 0 0;
        cursor: pointer;
        border: none;
        border-radius: 5px;
      }

      #startWebcamButton {
        display: inline-block;
      }

      #startRecordingButton,
      #stopRecordingButton {
        display: none;
      }

      #status {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Interview</h1>

    <!-- Webcam -->
    <section>
      <h2>Camera</h2>

      <video id="preview" autoplay muted playsinline></video>

      <br />

      <button id="startWebcamButton">Start Webcam</button>
    </section>

    <!-- Question -->
    <section id="questionSection">
      <h2>Question</h2>

      <p id="question">Tell us about your backend development experience.</p>

      <div id="recordingSection">
        <button id="startRecordingButton">Start Answer</button>

        <button id="stopRecordingButton">Stop Answer</button>
      </div>
    </section>

    <div id="status"></div>

    <script>
      const sessionId = "session_001";
      const questionId = "question_001";

      const preview = document.getElementById("preview");

      const startWebcamButton = document.getElementById("startWebcamButton");

      const questionSection = document.getElementById("questionSection");

      const recordingSection = document.getElementById("recordingSection");

      const startRecordingButton = document.getElementById("startRecordingButton");

      const stopRecordingButton = document.getElementById("stopRecordingButton");

      const status = document.getElementById("status");

      let mediaStream = null;
      let mediaRecorder = null;
      let chunks = [];

      // --------------------------------
      // Start webcam
      // --------------------------------

      startWebcamButton.addEventListener("click", async () => {
        try {
          status.textContent = "Requesting camera and microphone...";

          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });

          // Show webcam
          preview.srcObject = mediaStream;

          status.textContent = "✅ Webcam started successfully.";

          // Hide webcam button
          startWebcamButton.style.display = "none";

          // --------------------------------
          // Only now show question
          // --------------------------------

          questionSection.style.display = "block";

          recordingSection.style.display = "block";

          startRecordingButton.style.display = "inline-block";
        } catch (error) {
          console.error(error);

          status.textContent = "❌ Unable to access camera or microphone.";
        }
      });

      // --------------------------------
      // Start recording
      // --------------------------------

      startRecordingButton.addEventListener("click", () => {
        if (!mediaStream) {
          status.textContent = "❌ Start the webcam first.";

          return;
        }

        chunks = [];

        const mimeTypes = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];

        const supportedType = mimeTypes.find((type) => MediaRecorder.isTypeSupported(type));

        if (!supportedType) {
          status.textContent = "❌ Your browser does not support video recording.";

          return;
        }

        mediaRecorder = new MediaRecorder(mediaStream, {
          mimeType: supportedType,
        });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(chunks, {
            type: supportedType,
          });

          await uploadAnswer(blob);
        };

        mediaRecorder.start();

        startRecordingButton.style.display = "none";

        stopRecordingButton.style.display = "inline-block";

        status.textContent = "🔴 Recording your answer...";
      });

      // --------------------------------
      // Stop recording
      // --------------------------------

      stopRecordingButton.addEventListener("click", () => {
        if (!mediaRecorder) {
          return;
        }

        mediaRecorder.stop();

        startRecordingButton.style.display = "inline-block";

        stopRecordingButton.style.display = "none";

        status.textContent = "⏳ Uploading your answer...";
      });

      // --------------------------------
      // Upload answer
      // --------------------------------

      async function uploadAnswer(blob) {
        const formData = new FormData();

        formData.append("session_id", sessionId);

        formData.append("question_id", questionId);

        formData.append("answer", blob, `${sessionId}_${questionId}.webm`);

        try {
          const response = await fetch("/interviews/answers", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Upload failed");
          }

          console.log(data);

          status.textContent = "✅ Answer uploaded successfully.";
        } catch (error) {
          console.error(error);

          status.textContent = `❌ Upload failed: ${error.message}`;
        }
      }
    </script>
  </body>
</html>
